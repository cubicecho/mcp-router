# TEMPORARY: the sign-in and API-key part of /graphql, until the better-auth server branch serves it.
#
# The server does not serve these fields yet, so codegen reads them from here beside the printed schema, and the
# stories' mock runs every answer through the two together. Delete this file, and its line in `codegen.ts`, when the
# server branch merges: the printed schema then holds all of it.
#
# The sign-in and SSO types are ai-router's SDL, copied as written (server/auth/resolvers.ts, server/sso/resolvers.ts,
# and the better-auth operations @cubicecho/graphql-better-auth serves there). `me` and the multi-user admin
# mutations are left out: this router has one operator.

"How people sign in to this router, so the sign-in page offers only that."
type AuthConfig {
  "Whoever opens the UI is signed in as the admin, with no provider. Private networks only."
  trustedNetwork: Boolean!
  "The OIDC provider to sign in with (OIDC_ISSUER, or the paired one), or null when there is none."
  sso: SsoProvider
}

"An OpenID Connect provider the sign-in page offers."
type SsoProvider {
  "What the button calls it (OIDC_NAME, or the name in the setup URL)."
  name: String!
  "Where the button sends the browser. Absolute: in development the server is not the UI's origin."
  signInUrl: String!
}

"A session, as the UI keeps it."
type IssuedSession {
  "Sent back as `Authorization: Bearer`."
  token: String!
  userId: UUID!
}

"Where the router's OIDC provider comes from."
enum SsoSource {
  "OIDC_ISSUER in the server's environment. Read-only from the UI."
  ENV
  "Paired from a setup URL."
  PAIRED
  "There is none."
  NONE
}

"How sign-in through an OIDC provider is set up, and whether the caller may change it."
type SsoSetup {
  source: SsoSource!
  "The provider's issuer URL. Only for a caller who may pair."
  issuer: String
  "What the login page's button calls the provider."
  name: String
  "Whether the caller may pair a provider, or disconnect the paired one."
  canPair: Boolean!
  "The redirect URI to register with a provider by hand, for an OIDC_ISSUER setup."
  redirectUri: String!
}

type AuthSignOutResult {
  success: Boolean
  "Provider logout URL when RP-initiated logout is available"
  url: String
  "Whether the client should redirect to the provider logout URL"
  redirect: Boolean
}

type AuthVerifyOneTimeTokenResult {
  "The session, to send as `Authorization: Bearer <token>`."
  token: String!
  "The session's user."
  userId: String!
}

"A key a machine caller (an MCP client, an agent) sends as `Authorization: Bearer <key>`. The secret is never stored."
type ApiKey {
  id: UUID!
  name: String!
  "The key's first characters, kept in the clear so it can be told apart."
  start: String
  createdAt: DateTime!
  lastUsedAt: DateTime
  expiresAt: DateTime
}

"A key as it is made: the only time its secret is shown."
type CreatedApiKey {
  apiKey: ApiKey!
  "The whole key. Never shown again."
  key: String!
}

extend type Query {
  authConfig: AuthConfig!
  "Readable signed out, so a new router's login page can offer to set sign-in up."
  ssoSetup: SsoSetup!
  "The operator's API keys. Operator only."
  apiKeys: [ApiKey!]!
}

extend type Mutation {
  "On a trusted network (SECURE_LOCAL_NET), signs whoever opened the UI in as the local admin. Refused anywhere else."
  signInOnTrustedNetwork: IssuedSession!
  "Sign out the current user"
  signOut: AuthSignOutResult!
  "better-auth's `/one-time-token/verify`."
  verifyOneTimeToken(
    """
    The token to verify. Eg: "some-token"
    """
    token: String!
  ): AuthVerifyOneTimeTokenResult!
  """
  Pairs with the provider a setup URL names (`<issuer>#setup=<token>&name=<name>`). The admin, or
  anyone on an router with no accounts. BAD_USER_INPUT or TOO_MANY_REQUESTS with
  `extensions.reason` when the provider would not pair.
  """
  pairSso(setupUrl: String!): SsoSetup!
  "Deletes the paired provider's client and stops offering it on the login page. Same rule as pairSso."
  unpairSso: SsoSetup!
  "Makes an API key. Its secret is in the answer and nowhere else. Operator only."
  createApiKey(name: String!): CreatedApiKey!
  "Revokes an API key: a client sending it is refused from then on. Operator only."
  revokeApiKey(id: UUID!): Boolean!
}
