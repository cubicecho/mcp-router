name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A run by hand, for when GitHub drops the push event and main is left with no
  # CI run for the release to wait on.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - name: Lint
        run: npx biome ci .
      # The server prints its schema and the app's typed documents are generated from it; both are gitignored.
      - name: Generate GraphQL types
        run: npm run codegen
      - name: Typecheck
        run: npm run check:types
      # The stories run as tests in a real Chromium.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test
        run: npm test
      # The web UI's bundle. The server has no build step: it runs from its sources.
      - name: Build
        run: npm run build

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: ci }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      MIGRATIONS_DIR: server/drizzle
    steps:
      - uses: actions/checkout@v7
      # Passes without checking anything until the repo has committed migrations.
      - name: Find migrations
        id: migrations
        run: |
          if [ -d "$MIGRATIONS_DIR" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No $MIGRATIONS_DIR yet, so there are no migrations to check."
          fi
      - uses: actions/setup-node@v7
        if: steps.migrations.outputs.present == 'true'
        with:
          node-version: '26'
          cache: 'npm'
      - if: steps.migrations.outputs.present == 'true'
        run: npm ci
      - name: Migrations apply
        if: steps.migrations.outputs.present == 'true'
        run: npm run db:migrate
      # drizzle-kit writes nothing when the models and migrations agree.
      - name: Migrations match the models
        if: steps.migrations.outputs.present == 'true'
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain "$MIGRATIONS_DIR")" ]; then
            git status --porcelain "$MIGRATIONS_DIR"
            echo "::error::The models changed without a migration. Run npm run db:generate and commit $MIGRATIONS_DIR."
            exit 1
          fi

  boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Loaded into the local daemon under the tag docker-compose.yml runs, so `up --no-build` uses it.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: mcp-router:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # --wait blocks until the container's healthcheck passes.
      - name: Start the stack
        run: docker compose up -d --no-build --wait --wait-timeout 180
      - name: Check /healthz
        run: curl -fsS http://127.0.0.1:3000/healthz
      - name: Logs
        if: failure()
        run: docker compose logs
