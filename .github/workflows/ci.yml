name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - name: Lint
        run: npx biome ci .
      - name: Typecheck
        run: npm run check:types
      # The stories run as tests in a real Chromium.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Loaded into the local daemon under the tag docker-compose.yml runs, so `up --no-build` uses it.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: mcp-router:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # --wait blocks until the container's healthcheck passes.
      - name: Start the stack
        run: docker compose up -d --no-build --wait --wait-timeout 180
      - name: Check /healthz
        run: curl -fsS http://127.0.0.1:3000/healthz
      - name: Logs
        if: failure()
        run: docker compose logs
