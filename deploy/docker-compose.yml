# MCP Router — run the published image beside its own Postgres with Docker Compose.
#
#   docker compose up -d     then open http://localhost:3000 and enter your token
#
# Portainer and Dockhand deploy this same file as a stack (see deploy/templates.json).
# Every value below can be set from the environment or a .env file beside this one.
services:
  mcp-router:
    image: vantreeseba/mcp-router:${MCP_ROUTER_VERSION:-latest}
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - '${MCP_ROUTER_PORT:-3000}:3000'
    # LAN discovery (finding MCP servers on the network, and announcing the router)
    # uses mDNS multicast, which the default bridge network drops. For it to work,
    # replace `ports` with:
    # network_mode: host
    # (and reach Postgres on a published port, since host networking leaves the
    # compose network).
    volumes:
      # Installed server packages and caches. The config is in Postgres.
      # The container runs as uid 1000, so the folder must be writable by it
      # (`sudo chown 1000:1000 data`): Docker creates a missing one as root.
      - ${MCP_ROUTER_DATA:-./data}:/data
    environment:
      # The router's config database. Required: boot refuses to start without it.
      # Point it at your own Postgres instead to drop the service below.
      DATABASE_URL: ${DATABASE_URL:-postgres://mcp_router:${POSTGRES_PASSWORD:-mcp_router}@postgres:5432/mcp_router}
      # Signs UI sessions. Required: the image runs in production, where the
      # router refuses to start without a strong one. `openssl rand -hex 32`.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET, e.g. openssl rand -hex 32}
      # true: whoever opens the web UI is signed in as the local admin, with no
      # OIDC provider. Only on a network you trust. MCP clients still need an API
      # key, made in the UI's Settings.
      SECURE_LOCAL_NET: ${SECURE_LOCAL_NET:-false}
      # Or sign in through an OIDC provider (or paste its setup URL on the login
      # page instead). See .env.example for the rest of the OIDC_* variables.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      # Optional: the old router token, imported on boot as an API key so clients
      # configured with it keep working.
      MCP_ROUTER_TOKEN: ${MCP_ROUTER_TOKEN:-}
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mcp_router
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mcp_router}
      POSTGRES_DB: mcp_router
    # No `ports`: the database is for the router beside it. Back up with
    # `docker compose exec postgres pg_dump -U mcp_router mcp_router > backup.sql`.
    volumes:
      - mcp_router_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mcp_router -d mcp_router']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  mcp_router_pgdata:
