# Builds the image from this checkout and runs it: `docker compose up -d --build`.
# deploy/docker-compose.yml runs the published image instead.
name: mcp-router
services:
  mcp-router:
    image: mcp-router
    build: .
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    # LAN discovery (finding servers on the network, and announcing the router)
    # uses mDNS multicast, which the default bridge network drops. For it to work,
    # replace `ports` with:
    # network_mode: host
    # The database (PGlite in /data/pg), installed server packages, caches and
    # logs. A named volume, because the container runs as node (uid 1000) and a
    # bind mount keeps the host folder's owner. Config is managed from the web UI,
    # /graphql or /api; there are no config files to edit.
    volumes: [mcp_router_data:/data]
    environment:
      # Set a bearer token, OR set SECURE_LOCAL_NET=true to disable auth on a
      # trusted local network. If neither is set, a token is generated into the
      # database on first run and printed to the logs.
      MCP_ROUTER_TOKEN: ${MCP_ROUTER_TOKEN:-}
      SECURE_LOCAL_NET: ${SECURE_LOCAL_NET:-false}
    healthcheck:
      # /healthz needs no token and answers 200 once the server is listening.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
volumes:
  mcp_router_data:
